# Cool_Astronaut theme for tmux - auto-generated from wallpaper

set -g message-style 'fg=#f49157 bg=default'

set -g pane-border-style "fg=#1a2135"
set -g pane-active-border-style "fg=#6ac67a"

set -g window-status-format "#[fg=#5a637b,bg=default]#W"
set -g window-status-current-format "#[fg=#e87877]⇢ #W"

set -g status-style 'fg=#e5dcda bg=default'
set -g status-right-style 'fg=#f49157 bg=default bold'
