# Core theme for tmux - auto-generated from wallpaper

set -g message-style 'fg=#b2b63e bg=default'

set -g pane-border-style "fg=#072630"
set -g pane-active-border-style "fg=#00c5de"

set -g window-status-format "#[fg=#4a6974,bg=default]#W"
set -g window-status-current-format "#[fg=#d37bc0]⇢ #W"

set -g status-style 'fg=#d8dfe3 bg=default'
set -g status-right-style 'fg=#b2b63e bg=default bold'
