# Fiery theme for tmux - auto-generated from wallpaper

set -g message-style 'fg=#f39256 bg=default'

set -g pane-border-style "fg=#1a2035"
set -g pane-active-border-style "fg=#68c67b"

set -g window-status-format "#[fg=#5a627b,bg=default]#W"
set -g window-status-current-format "#[fg=#e97875]⇢ #W"

set -g status-style 'fg=#e5dcda bg=default'
set -g status-right-style 'fg=#f39256 bg=default bold'
