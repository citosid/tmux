# Mcdonald theme for tmux - auto-generated from wallpaper

set -g message-style 'fg=#f98696 bg=default'

set -g pane-border-style "fg=#0a2531"
set -g pane-active-border-style "fg=#00c2e8"

set -g window-status-format "#[fg=#4c6876,bg=default]#W"
set -g window-status-current-format "#[fg=#da78b4]⇢ #W"

set -g status-style 'fg=#dadee5 bg=default'
set -g status-right-style 'fg=#f98696 bg=default bold'
