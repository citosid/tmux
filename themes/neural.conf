# Neural theme for tmux - auto-generated from wallpaper

set -g message-style 'fg=#eb9943 bg=default'

set -g pane-border-style "fg=#072821"
set -g pane-active-border-style "fg=#46c992"

set -g window-status-format "#[fg=#4b6b62,bg=default]#W"
set -g window-status-current-format "#[fg=#e77b5f]⇢ #W"

set -g status-style 'fg=#e2ddd7 bg=default'
set -g status-right-style 'fg=#eb9943 bg=default bold'
