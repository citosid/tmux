# Sunset theme for tmux - auto-generated from wallpaper

set -g message-style 'fg=#f29352 bg=default'

set -g pane-border-style "fg=#1b2035"
set -g pane-active-border-style "fg=#61c780"

set -g window-status-format "#[fg=#5c627b,bg=default]#W"
set -g window-status-current-format "#[fg=#e97871]⇢ #W"

set -g status-style 'fg=#e4dcd9 bg=default'
set -g status-right-style 'fg=#f29352 bg=default bold'
